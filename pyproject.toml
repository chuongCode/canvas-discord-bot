[project]
name = "phat-discord-bot"
version = "1.0.0"
description = "Personal Discord bot that turns Canvas LMS deadlines into escalating reminders"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "psycopg[binary,pool]>=3.1,<4",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "pgserver>=0.1.4; sys_platform != 'win32'",
]

[project.scripts]
phat-bot = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
