# Optional Render Blueprint. You can also create the service by hand — see the
# "Deploy to Render" section of the README.
#
# Secrets are marked `sync: false`: Render prompts for them in the dashboard and
# they are never stored in this repository.
services:
  - type: web
    name: phat-discord-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: phat-discord-bot-db
          property: connectionString
      - key: CANVAS_BASE_URL
        sync: false
      - key: CANVAS_API_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: TIMEZONE
        value: America/Chicago
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: phat-discord-bot-db
    plan: free
    databaseName: phat
    user: phat
