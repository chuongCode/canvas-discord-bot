services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phat
      POSTGRES_PASSWORD: phat
      POSTGRES_DB: phat
    ports:
      # Exposed so `python -m app.main` on the host can use the same database.
      - "5432:5432"
    volumes:
      - canvas-bot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phat -d phat"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever .env says: inside the compose network the database
      # is reachable as `db`, not localhost.
      DATABASE_URL: postgresql://phat:phat@db:5432/phat
      PORT: "8080"
      HTTP_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  canvas-bot-pgdata:
